[package]
name = "indidus-wasm-share-client"
version = "0.1.0"
edition = "2024"
description = "WebAssembly client for decrypting and downloading Indidus shares"
authors = ["Indidus Team"]
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Text", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Blob", "BlobPropertyBag", "Url"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
sha2 = "0.11.0"
argon2 = "0.5"
getrandom = "0.4.2"
base64 = "0.22"
hex = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
